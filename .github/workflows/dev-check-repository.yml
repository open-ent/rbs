name: dev-check-repository

# Workflow legacy (Node 10 + Gulp + Gradle) incompatible avec ce module migré
# (frontend React/Vite/pnpm + backend Maven). Le contrôle réel est assuré par
# build-and-publish.yml. Déclencheur neutralisé pour éviter des échecs systématiques
# au push ; reste lançable manuellement si besoin.
on: workflow_dispatch

jobs:
  build-node-test:
    runs-on: ubuntu-latest

    container:
      image: opendigitaleducation/node:10-alpine
      options: --user root -v ${{ github.workspace }}:/home/node/:rw

    steps:
      - uses: actions/checkout@v1
      - name: Run npm install
        run: npm install
      - name: Run build node with Gulp
        run: node_modules/gulp/bin/gulp.js build
      - name: Run test
        run: npm test

  build-gradle-test:
    runs-on: ubuntu-latest

    container:
      image: gradle:4.5-alpine
      options: --user root -v ${{ github.workspace }}:/home/gradle/:rw

    steps:
      - uses: actions/checkout@v1
      - name: Run build gradle
        run: gradle assemble -g gradle-user-home
      - name: Run gradle test
        run: gradle test  -g gradle-user-home --no-build-cache --rerun-tasks
